name: Feature request
description: Suggest a tool, or a change to one, that would save you time.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Every tool in Tools4i started as a task somebody was doing the slow way,
        so this is the most useful thing you can send.

        Please keep real library, object and user names out of the examples.
        Everything you write here is public.

        You can write in English or in Spanish.

  - type: input
    id: tool
    attributes:
      label: Which tool, or which part of the day
      description: The panel it belongs to, or the task it would help with if no tool covers it yet.
      placeholder: "Sources Scan Results"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem you are trying to solve
      description: What you are trying to get done, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The slow way, or the tool outside the editor you have to reach for.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
      description: Your idea of how it should work, if you have one.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How often this comes up, how many people it would affect, an example with invented names.
    validations:
      required: false
